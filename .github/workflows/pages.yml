# Publishes the Burn Wars scoreboard (site/) to GitHub Pages with fresh data (site/data.json, never committed).
# Each run starts the next one about 10 minutes later (GitHub's own schedule skips runs for hours);
# the hourly schedule only restarts the chain if it ever breaks.
name: Publish Burn Wars
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  SITE: https://burnwars.lol
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Note the start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Last published data (burn history and events carry over)
        run: curl -fsSL "$SITE/data.json" -o site/data.json || true
      - name: Build scoreboard data
        continue-on-error: true
        run: node scripts/build.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Start the next run in ~10 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - ${T0:-0} ))
          wait=$(( 540 - elapsed )); if [ $wait -gt 0 ]; then sleep $wait; fi
          active=$(gh run list -R "$GITHUB_REPOSITORY" -w pages.yml -L 20 --json status -q '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$active" -le 1 ]; then gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main; else echo "another run is already queued ($active active)"; fi
